  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 34, 0.75);

      --border: rgba(255, 255, 255, 0.08);

      --primary: #38bdf8;
      --accent: #818cf8;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --tag-bg: rgba(56, 189, 248, 0.08);
      --tag-border: rgba(56, 189, 248, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;

      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px;
      overflow-x: hidden;
    }

    /* Ambient background lighting */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 450px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12), rgba(129, 140, 248, 0.06), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 800px;
      position: relative;
      z-index: 1;
    }

    header { margin-bottom: 48px; }

    .badge-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--primary);
    }

    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 40%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-muted);
      max-width: 650px;
    }

    .meta-location {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 8px;
    }

    .links-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 9px 18px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .btn-primary {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }

    section { margin-bottom: 48px; }

    .section-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .lead-text {
      font-size: 1rem;
      color: #d1d5db;
      margin-bottom: 16px;
    }

    .lead-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Grids */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 620px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

      border-color: var(--border-hover);
      transform: translateY(-3px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
